server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: jpa-backend
  datasource:
    url: jdbc:h2:mem:configdb
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  health:
    config:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
